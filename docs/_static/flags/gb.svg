<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <!-- Blue background -->
  <rect width="60" height="30" fill="#012169"/>
  
  <!-- White cross -->
  <path d="M0 15 H60 M30 0 V30" stroke="white" stroke-width="2"/>
  
  <!-- Red cross -->
  <path d="M0 15 H60 M30 0 V30" stroke="#C8102E" stroke-width="1"/>
  
  <!-- Diagonal cross (Union Jack pattern simplified) -->
  <path d="M0 0 L60 30 M60 0 L0 30" stroke="white" stroke-width="2"/>
  <path d="M0 0 L60 30 M60 0 L0 30" stroke="#C8102E" stroke-width="1"/>
</svg>
